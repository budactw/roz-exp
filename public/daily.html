<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RO樂園每日任務待辦清單｜凌雲閣－師爺</title>
<meta name="author" content="凌雲閣－師爺">
<link rel="stylesheet" href="style.css?v=11">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WEJKY0CV80"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  // 本機測試不計入
  if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) gtag('config', 'G-WEJKY0CV80');
  function track(name, params) { try { gtag('event', name, params || {}); } catch (e) {} }
</script>

<style>
  /* ===== 每日任務頁專用 ===== */
  /* 右欄黏頂時，內容超過螢幕高度改為欄內捲動 */
  @media (min-width: 980px) { .side { max-height: calc(100vh - 32px); overflow-y: auto; padding: 4px; margin: -4px; scrollbar-width: thin; } }
  .chars { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chars .chip.cur { border-color: var(--primary); background: var(--soft); color: var(--primary); font-weight: 700; box-shadow: 0 0 0 1px var(--primary) inset; }
  .chars .chip { user-select: none; }
  .summary { display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); margin-top: 12px; }
  .summary .tile { padding: 10px 12px; }
  .summary .tile .v { font-size: 1.3rem; }
  .reset-info { font-size: .78rem; color: var(--dim); margin-top: 8px; }

  .region { border: 1px solid var(--card-border); border-radius: 12px; background: var(--tile-bg); margin-bottom: 12px; overflow: hidden; }
  .region > h3 { margin: 0; padding: 10px 12px; font-size: .95rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--card-border); }
  .region > h3 .prog { font-size: .75rem; color: var(--dim); font-weight: 500; }
  .region > h3 .acts { margin-left: auto; display: flex; gap: 6px; }
  .region > h3 .tg { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .region > h3 .tg .arrow { color: var(--dim); font-size: .8rem; transition: transform .2s; display: inline-block; }
  .region.collapsed > h3 .tg .arrow { transform: rotate(-90deg); }
  .region.collapsed > h3 { border-bottom: 0; }
  .region.collapsed > :not(h3) { display: none; }
  .region.all-done > h3 { background: rgba(246,195,67,.28); }
  .region.all-done > h3 .prog { color: #a16800; font-weight: 700; }
  [data-theme="dark"] .region.all-done > h3 .prog { color: #ffd66b; }
  .region.all-turned > h3 { background: rgba(0,171,85,.3); }
  .region.all-turned > h3 .prog { color: var(--green); font-weight: 700; }
  .region > h3 .acts button { min-height: 28px; padding: 0 10px; font-size: .74rem; }
  .qrow { border-bottom: 1px solid var(--card-border); }
  .qrow:last-child { border-bottom: 0; }
  .qrow .main { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex-wrap: wrap; }
  .qrow .name { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .qrow .name .lv { font-size: .7rem; color: var(--dim); }
  .qrow .name .arrow { color: var(--dim); font-size: .75rem; transition: transform .2s; }
  .qrow.open .name .arrow { transform: rotate(90deg); }
  .qrow .states { display: inline-flex; background: var(--seg-bg); border-radius: 9px; padding: 3px; gap: 2px; }
  .qrow .states button { min-height: 30px; padding: 0 10px; font-size: .78rem; font-weight: 700; border-radius: 7px; background: transparent; color: var(--dim); }
  .qrow .states button.on-none { background: var(--card); color: var(--text); }
  .qrow .states button.on-done { background: #f6c343; color: #3d2a00; }
  .qrow .states button.on-turned { background: var(--green); color: #fff; }
  .qrow.st-done .main { background: rgba(246,195,67,.16); }
  .qrow.st-turned .main { background: rgba(0,171,85,.12); }
  .qrow.st-turned .name > span.t { text-decoration: line-through; color: var(--dim); }
  .qrow .detail { display: none; padding: 6px 12px 12px 12px; font-size: .84rem; color: var(--text); border-top: 1px dashed var(--card-border); background: var(--card); }
  .qrow.open .detail { display: block; }
  .detail .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .detail .k { color: var(--dim); font-size: .76rem; min-width: 3.2em; }
  .navi { font-family: ui-monospace, Menlo, monospace; font-size: .8rem; background: var(--soft); border: 1px solid var(--card-border); border-radius: 6px; padding: 2px 8px; }
  .btn-copy { padding: 0 10px; min-height: 26px; font-size: .74rem; background: var(--seg-active); color: #fff; border-radius: 999px; }
  .qt { font-size: .66rem; font-weight: 700; padding: 1px 5px; border-radius: 4px; white-space: nowrap; border: 1px solid currentColor; opacity: .85; }

  .mats { display: grid; gap: 6px; padding: 8px; }
  .mats .sec-title { margin: 6px 0 0; }
  #mats .region { margin-bottom: 10px; }
  #mats .region > h3 .cnt { font-size: .75rem; color: var(--dim); font-weight: 500; margin-left: auto; }
  .mat { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--card-border); border-radius: 10px; background: var(--tile-bg); font-size: .9rem; cursor: pointer; }
  .mat input { width: 16px; height: 16px; accent-color: var(--green); flex-shrink: 0; }
  .mat .n { white-space: nowrap; }
  .mat .q { margin-left: auto; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mat.ok { opacity: .55; }
  .mat.ok .n { text-decoration: line-through; }
  .mat .from { font-size: .72rem; color: var(--dim); flex-basis: 100%; padding-left: 24px; }
  .empty { color: var(--dim); font-size: .85rem; padding: 14px; text-align: center; border: 1px dashed var(--card-border); border-radius: 10px; }

  .route .region > h3 { background: var(--soft); }
  .route .step { padding: 8px 12px; border-bottom: 1px solid var(--card-border); font-size: .86rem; }
  .route .step:last-child { border-bottom: 0; }
  .route .step b { display: block; margin-bottom: 2px; }
  .route .tip { padding: 8px 12px; font-size: .78rem; color: var(--dim); background: var(--soft); }
  .route .tip { line-height: 1.6; }
  .tip-sec { margin: 4px 0; }
  .tip-sec + .tip-sec { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--card-border); }
  .tip-sec > b { color: var(--primary); margin-right: 6px; }
  .tip-sec ol { margin: 4px 0 0; padding-left: 1.4em; }
  .tip-sec li { margin: 2px 0; }
  .tip-imgs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; align-items: flex-start; }
  .tip-imgs figure { margin: 0; }
  .tip-imgs img { display: block; height: 150px; width: auto; max-width: 100%; object-fit: cover; border-radius: 8px; border: 1px solid var(--card-border); }
  .tip-imgs figcaption { font-size: .72rem; color: var(--dim); margin-top: 4px; text-align: center; }
  .route .step.turned { opacity: .5; }

  .board-filter { margin-bottom: 10px; }
  .board-filter button { min-height: 30px; padding: 0 12px; font-size: .8rem; }
  .modal-card:not(.sorting) .sel-item .handle, .modal-card:not(.sorting) .sel-region .rhandle { display: none; }
  .sel-region .rhandle { cursor: grab; color: var(--dim); font-weight: 700; padding: 2px 8px 2px 0; touch-action: none; font-size: 1rem; }
  .sel-region.dragging { opacity: .4; }
  .sel-region.over { outline: 2px dashed var(--primary); outline-offset: -2px; }
  .modal-card.sorting .sel-item .handle { display: inline; }
  .modal-card.sorting .sel-item input[type=checkbox] { display: none; }
  .modal-card.sorting .sel-item { cursor: default; }
  .modal-card.sorting .sel-item .nm { pointer-events: none; }
  .sel-item .handle { cursor: grab; color: var(--dim); font-weight: 700; padding: 4px 8px; margin: -4px 0; touch-action: none; font-size: 1rem; }
  .sel-item .nm { flex: 1; min-width: 0; }
  .sel-item.dragging { opacity: .4; }
  .sel-item.over { outline: 2px dashed var(--primary); outline-offset: -2px; }
  .sel-region h3 .q-reset { min-height: 24px; padding: 0 8px; font-size: .7rem; }
  .sel-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; flex-shrink: 0; }
  .sel-filters .seg button { min-height: 28px; padding: 0 10px; font-size: .78rem; }
  .sel-filters .btn-ghost { min-height: 28px; padding: 0 10px; font-size: .78rem; }
  .sel-region { border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; background: var(--tile-bg); }
  .sel-region h3 { margin: 0; padding: 8px 12px; font-size: .9rem; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--card-border); }
  .sel-region h3 .acts { margin-left: auto; display: flex; gap: 6px; }
  .sel-region h3 .acts button { min-height: 26px; padding: 0 8px; font-size: .72rem; }
  .sel-item { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: .84rem; border-bottom: 1px solid rgba(0,0,0,.05); cursor: pointer; }
  .sel-item:last-child { border-bottom: 0; }
  .sel-item input { width: 16px; height: 16px; accent-color: var(--primary); }
  [data-theme="dark"] .sel-item { border-bottom-color: rgba(255,255,255,.06); }
  .modal-card .q-body { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .sel-item .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sel-item .nm:hover { white-space: normal; }
  .qrow .name .lv, .card h2 button, .card h2 .check { white-space: nowrap; }
  .card h2 { flex-wrap: wrap; }
  @media (max-width: 520px) {
    .summary { grid-template-columns: 1fr 1fr 1fr; gap: 6px; } .summary .tile .v { font-size: 1.05rem; }
    .card h2 > .row, .card h2 > .check { flex-basis: 100%; margin-left: 0 !important; }
    .region > h3 .acts { margin-left: 0; flex-basis: 100%; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="brand">
      <h1>RO樂園每日任務待辦清單 <small>by 凌雲閣－師爺</small></h1>
      <nav class="tabs"><a href="./">⚡ 經驗試算</a><a class="active" href="daily.html">📋 每日任務</a><a href="events.html">🎃 限定活動</a></nav>
    </div>
    <div class="row">
      <button class="btn-ghost" id="themeBtn" onclick="toggleTheme()">🌙 夜間模式</button>
      <button class="btn-ghost" onclick="openBug()">🐞 回報問題</button>
    </div>
  </div>

  <!-- 角色 -->
  <div class="card">
    <h2>👤 角色</h2>
    <div class="chars" id="chars"></div>
    <div class="summary">
      <div class="tile"><div class="k">今日任務</div><div class="v" id="sumTotal">0</div></div>
      <div class="tile"><div class="k">已完成（待還）</div><div class="v" style="color:#d19a00" id="sumDone">0</div></div>
      <div class="tile"><div class="k">已還</div><div class="v g" id="sumTurned">0</div></div>
    </div>
    <div class="reset-info" id="resetInfo"></div>
  </div>

  <div class="layout">
    <div class="main">
      <!-- 今日任務 -->
      <div class="card">
        <h2><span class="n">1</span> 📋 今日任務 <span id="boardChar" style="color:var(--primary); font-weight:800;"></span>
          <span class="row" style="margin-left:auto; gap:6px;">
            <button class="btn-ghost" id="expB" onclick="toggleAll('b')"></button>
            <button class="btn-sm" onclick="openSelect()">✏️ 編輯清單</button>
            <button class="btn-ghost" onclick="resetToday()" title="把今天的狀態全部清回未做">↺ 清除今日</button>
          </span>
        </h2>
        <div class="seg board-filter" id="boardType">
          <button type="button" data-v="all" class="active" onclick="setBoardType('all')">全部</button>
          <button type="button" data-v="kill" onclick="setBoardType('kill')">打怪</button>
          <button type="button" data-v="item" onclick="setBoardType('item')">交材料</button>
          <button type="button" data-v="talk" onclick="setBoardType('talk')">對話</button>
          <button type="button" data-v="deliver" onclick="setBoardType('deliver')">運送</button>
        </div>
        <div id="board"></div>
      </div>

      <!-- 路線指引 -->
      <div class="card route">
        <h2><span class="n">2</span> 🗺️ 路線指引
          <span class="row" style="margin-left:auto; gap:10px;">
            <label class="check" style="font-size:.8rem;"><input type="checkbox" id="routeAll" onchange="render()"> 顯示全部任務</label>
            <button class="btn-ghost" id="expR" onclick="toggleAll('r')"></button>
          </span>
        </h2>
        <div id="route"></div>
      </div>
    </div>

    <div class="side">
      <!-- 材料 -->
      <div class="card">
        <h2>🎒 要帶的材料 <button class="btn-ghost" id="expM" style="margin-left:auto;" onclick="toggleAll('m')"></button></h2>
        <div id="mats"></div>
      </div>
    </div>
  </div>

  <div class="foot">
    <div class="recruit">🏯 凌雲閣收人，歡迎 DC 私訊 <b>zhuge0520</b> <button class="btn-copy" onclick="copyText('zhuge0520', this)">複製</button></div>
    <div style="margin-top:8px;">作者：凌雲閣－師爺　·　任務資料參考 <a href="https://ro-zero-site.pages.dev/quests" target="_blank" rel="noopener" style="color:var(--primary)">RO補給站</a>　·　<a href="#" onclick="openBug(); return false;" style="color:var(--primary)">🐞 回報問題</a></div>
  </div>
</div>

<!-- 頁內對話框（取代 prompt / confirm，避免 App 內建瀏覽器擋掉） -->
<div class="modal" id="dlg">
  <div class="modal-card" style="max-width:380px;">
    <div class="modal-head"><b id="dlgTitle"></b></div>
    <div class="hint" id="dlgMsg" style="margin-bottom:10px;"></div>
    <input type="text" id="dlgInput" class="hidden" style="margin-bottom:12px;" autocomplete="off">
    <div class="row" style="justify-content:flex-end;">
      <button class="btn-ghost" id="dlgCancel">取消</button>
      <button class="btn-sm" id="dlgOk" style="background:var(--seg-active); color:#fff; border:0;">確定</button>
    </div>
  </div>
</div>

<!-- 編輯每日清單 -->
<div class="modal" id="selModal" onclick="if(event.target===this) closeSelect()">
  <div class="modal-card modal-wide">
    <div class="modal-head">
      <b>✏️ 編輯「<span id="selCharName"></span>」的每日清單</b>
      <button class="btn-ghost" onclick="closeSelect()">✕</button>
    </div>
    <div class="hint" style="margin-bottom:8px;">勾選這個角色每天要做的任務。按「編輯排序」後可拖曳 ⋮⋮ 調整任務順序（同一地圖內）或地圖區塊的順序。清單與順序會記住，每天只重置完成狀態。</div>
    <div class="sel-filters">
      <div class="seg" id="selLv">
        <button type="button" data-v="all" class="active" onclick="setSelFilter('lv','all')">全部等級</button>
        <button type="button" data-v="90" onclick="setSelFilter('lv','90')">90</button>
        <button type="button" data-v="100" onclick="setSelFilter('lv','100')">100</button>
        <button type="button" data-v="105" onclick="setSelFilter('lv','105')">105</button>
        <button type="button" data-v="110" onclick="setSelFilter('lv','110')">110</button>
      </div>
      <div class="seg" id="selType">
        <button type="button" data-v="all" class="active" onclick="setSelFilter('type','all')">全部類型</button>
        <button type="button" data-v="kill" onclick="setSelFilter('type','kill')">打怪</button>
        <button type="button" data-v="item" onclick="setSelFilter('type','item')">交材料</button>
        <button type="button" data-v="talk" onclick="setSelFilter('type','talk')">對話</button>
        <button type="button" data-v="deliver" onclick="setSelFilter('type','deliver')">運送</button>
      </div>
      <span class="hint" id="selCount" style="margin:0;"></span>
      <span class="row" style="margin-left:auto; gap:6px;">
        <button class="btn-ghost" id="regionResetBtn" style="display:none;" onclick="resetRegionList()">恢復地圖順序</button>
        <button class="btn-sm" id="sortBtn" onclick="toggleSortMode()">↕️ 編輯排序</button>
      </span>
    </div>
    <div class="q-body" id="selBody"></div>
  </div>
</div>

<script src="quests-data.js?v=9"></script>
<script>
const $ = id => document.getElementById(id);
const ALL = QUEST_DB.flatMap(r => r.quests.map(q => ({ ...q, region: r.region, rlv: r.lv })));
const BY_ID = Object.fromEntries(ALL.map(q => [q.id, q]));
const pad = n => String(n).padStart(2, '0');

// ===== 每日 04:00 重置：以「現在減 4 小時」的日期當作今天的 key =====
function dayKey(d = new Date()) { const t = new Date(d.getTime() - 4 * 3600e3); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; }
function nextReset() { const d = new Date(); const r = new Date(d); r.setHours(4, 0, 0, 0); if (r <= d) r.setDate(r.getDate() + 1); return r; }

// ===== 狀態 =====
const KEY = 'roz-daily-v1';
let S = { cur: null, chars: {} };
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)) || S; } catch {}
  if (!Object.keys(S.chars).length) addChar('角色 1', false);
  if (!S.chars[S.cur]) S.cur = Object.keys(S.chars)[0];
  for (const c of Object.values(S.chars)) if (c.order && typeof c.order !== 'object' || Array.isArray(c.order)) delete c.order;   // 舊格式清掉
  rollover();
}
function cur() { return S.chars[S.cur]; }
function rollover() {
  const k = dayKey(); let changed = false;
  for (const c of Object.values(S.chars)) if (c.day !== k) { c.day = k; c.st = {}; c.mats = {}; changed = true; }
  if (changed) save();
}
setInterval(() => { rollover(); render(); }, 60000);

// ===== 頁內對話框 =====
function dialog({ title, msg = '', input = null, okText = '確定' }) {
  return new Promise(res => {
    const m = $('dlg'), inp = $('dlgInput');
    $('dlgTitle').innerText = title; $('dlgMsg').innerText = msg; $('dlgMsg').style.display = msg ? '' : 'none';
    inp.classList.toggle('hidden', input === null); inp.value = input || ''; $('dlgOk').innerText = okText;
    const close = v => { m.classList.remove('open'); $('dlgOk').onclick = $('dlgCancel').onclick = null; inp.onkeydown = null; res(v); };
    $('dlgOk').onclick = () => close(input === null ? true : inp.value.trim());
    $('dlgCancel').onclick = () => close(null);
    inp.onkeydown = e => { if (e.key === 'Enter') $('dlgOk').onclick(); };
    m.classList.add('open'); if (input !== null) setTimeout(() => inp.focus(), 50);
  });
}
const askText = (title, def = '') => dialog({ title, input: def });
const askConfirm = (title, msg = '') => dialog({ title, msg });

// ===== 角色 =====
async function addChar(name, ask = true) {
  if (ask) { name = await askText('新增角色：輸入角色名稱'); if (!name) return; }
  const id = 'c' + Date.now().toString(36);
  const base = S.cur && S.chars[S.cur] ? S.chars[S.cur].sel.slice() : [];   // 新角色先複製目前角色的清單，進度各自獨立
  S.chars[id] = { name: name.trim(), sel: base, st: {}, mats: {}, day: dayKey() };
  S.cur = id; save(); render(); track('add_char', { chars: Object.keys(S.chars).length });
}
async function renameChar() { const n = await askText('角色改名', cur().name); if (n) { cur().name = n; save(); render(); } }
async function deleteChar() {
  if (Object.keys(S.chars).length <= 1) { await dialog({ title: '至少要保留一個角色', okText: '知道了' }); return; }
  if (!await askConfirm(`刪除「${cur().name}」？`, '此角色的清單與今日紀錄會一併刪除。')) return;
  delete S.chars[S.cur]; S.cur = Object.keys(S.chars)[0]; save(); render();
}
function switchChar(id) { S.cur = id; save(); render(); }

// ===== 任務狀態 =====
function setState(qid, st) { const c = cur(); if (st === 'none') delete c.st[qid]; else c.st[qid] = st; save(); render(); if (st !== 'none') track('quest_' + st, { quest: qid }); }
function setRegionState(region, st) {
  const c = cur();
  ALL.filter(q => q.region === region && c.sel.includes(q.id) && (boardType === 'all' || q.type === boardType)).forEach(q => { if (st === 'none') delete c.st[q.id]; else c.st[q.id] = st; });
  save(); render();
}
async function resetToday() { if (!await askConfirm('清除今日？', `把「${cur().name}」今天的完成狀態與材料勾選全部清回未做。`)) return; cur().st = {}; cur().mats = {}; save(); render(); }
function toggleMat(name) { const c = cur(); if (c.mats[name]) delete c.mats[name]; else c.mats[name] = true; save(); render(); }
let boardType = 'all';   // 今日任務的類型篩選
function setBoardType(v) { boardType = v; render(); }
const openRows = new Set();
// 區塊收合（記在瀏覽器）
const COLL_KEY = 'roz-daily-collapsed';
let collapsed = new Set(JSON.parse(localStorage.getItem(COLL_KEY) || '[]'));
function saveCollapsed() { localStorage.setItem(COLL_KEY, JSON.stringify([...collapsed])); }
function toggleRegion(key) { collapsed.has(key) ? collapsed.delete(key) : collapsed.add(key); saveCollapsed(); render(); }
// 全部展開 / 全部收合：p = 'b' 今日任務、'r' 路線、'm' 材料
function toggleAll(p) {
  const keys = QUEST_DB.map(r => `${p}:${r.region}`);
  const anyCollapsed = keys.some(k => collapsed.has(k));
  keys.forEach(k => anyCollapsed ? collapsed.delete(k) : collapsed.add(k));
  saveCollapsed(); render();
}
function updateExpandBtns() {
  for (const [p, id] of [['b', 'expB'], ['r', 'expR'], ['m', 'expM']]) {
    const anyCollapsed = QUEST_DB.some(r => collapsed.has(`${p}:${r.region}`));
    $(id).innerText = anyCollapsed ? '⤵ 全部展開' : '⤴ 全部收合';
  }
}
function toggleRow(qid) { openRows.has(qid) ? openRows.delete(qid) : openRows.add(qid); render(); }

// ===== 編輯清單 =====
function openSelect() { renderSelect(); $('selModal').classList.add('open'); track('edit_list'); }
function toggleSel(qid, on) { const c = cur(); const i = c.sel.indexOf(qid); if (on && i < 0) c.sel.push(qid); if (!on && i >= 0) c.sel.splice(i, 1); save(); renderSelect(); }
function selRegion(region, on) { const c = cur(); const r = QUEST_DB.find(x => x.region === region); r.quests.filter(q => selMatch(r, q)).forEach(q => { const i = c.sel.indexOf(q.id); if (on && i < 0) c.sel.push(q.id); if (!on && i >= 0) c.sel.splice(i, 1); }); save(); renderSelect(); }
// ===== 區域內自訂順序（存在角色的 order[region]；舊資料沒有就照預設順序）=====
function regionOrder(c, r) {
  const ids = new Set(r.quests.map(q => q.id));
  const base = ((c.order && c.order[r.region]) || []).filter(id => ids.has(id));
  const seen = new Set(base);
  r.quests.forEach(q => { if (!seen.has(q.id)) { base.push(q.id); seen.add(q.id); } });
  return base;
}
function orderedQuests(c, r, filterFn) { const o = regionOrder(c, r); const idx = Object.fromEntries(o.map((id, i) => [id, i])); return r.quests.filter(filterFn).sort((a, b) => idx[a.id] - idx[b.id]); }
// 地圖區塊順序（存在角色的 regionOrder；舊資料沒有就照預設）
function regionList(c) {
  const names = new Set(QUEST_DB.map(r => r.region));
  const base = (c.regionOrder || []).filter(n => names.has(n));
  const seen = new Set(base);
  QUEST_DB.forEach(r => { if (!seen.has(r.region)) { base.push(r.region); seen.add(r.region); } });
  return base.map(n => QUEST_DB.find(r => r.region === n));
}
function orderedRegions(c, filterFn) { return regionList(c).map(r => ({ r, qs: orderedQuests(c, r, filterFn) })).filter(x => x.qs.length); }
function placeRegion(name, beforeName) {
  const c = cur(); const o = regionList(c).map(r => r.region).filter(n => n !== name);
  const j = beforeName ? o.indexOf(beforeName) : -1; o.splice(j < 0 ? o.length : j, 0, name); c.regionOrder = o; save(); renderSelect(); render();
}
function resetRegionList() { const c = cur(); delete c.regionOrder; save(); renderSelect(); render(); }
function setRegionOrder(c, r, o) { c.order = c.order || {}; c.order[r.region] = o; save(); }
function moveInRegion(region, id, delta) {
  const c = cur(), r = QUEST_DB.find(x => x.region === region); const o = regionOrder(c, r); const i = o.indexOf(id), j = i + delta;
  if (i < 0 || j < 0 || j >= o.length) return;
  o.splice(i, 1); o.splice(j, 0, id); setRegionOrder(c, r, o); renderSelect(); render();
}
function placeInRegion(region, id, beforeId) {
  const c = cur(), r = QUEST_DB.find(x => x.region === region); const o = regionOrder(c, r).filter(x => x !== id);
  const j = beforeId ? o.indexOf(beforeId) : -1; o.splice(j < 0 ? o.length : j, 0, id); setRegionOrder(c, r, o); renderSelect(); render();
}
function resetRegionOrder(region) { const c = cur(); if (c.order) delete c.order[region]; save(); renderSelect(); render(); }
// 拖曳（pointer events，滑鼠與觸控都可；只能在同一地圖內移動）
(function () {
  let dragId = null, dragRegion = null, dragRegionCard = null, overEl = null;
  document.addEventListener('pointerdown', e => {
    if (!sortMode) return;
    const rh = e.target.closest('.sel-region .rhandle');
    if (rh) { const card = rh.closest('.sel-region'); dragRegionCard = card.dataset.region; card.classList.add('dragging'); e.preventDefault(); return; }
    const h = e.target.closest('.sel-item .handle'); if (!h) return;
    const item = h.closest('.sel-item'); dragId = item.dataset.id; dragRegion = item.dataset.region; item.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('pointermove', e => {
    if (!dragId && !dragRegionCard) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    let target = null;
    if (dragRegionCard) { const card = el && el.closest('.sel-region'); target = card && card.dataset.region !== dragRegionCard ? card : null; }
    else { const item = el && el.closest('.sel-item'); target = item && item.dataset.id !== dragId && item.dataset.region === dragRegion ? item : null; }
    if (overEl && overEl !== target) overEl.classList.remove('over');
    overEl = target; if (overEl) overEl.classList.add('over');
    const box = $('selBody').getBoundingClientRect();
    if (e.clientY < box.top + 24) $('selBody').scrollTop -= 8; else if (e.clientY > box.bottom - 24) $('selBody').scrollTop += 8;
  });
  document.addEventListener('pointerup', e => {
    if (dragRegionCard) {
      const name = dragRegionCard; dragRegionCard = null;
      document.querySelectorAll('.sel-region.dragging').forEach(x => x.classList.remove('dragging'));
      if (overEl) { const r = overEl.getBoundingClientRect(); const after = e.clientY > r.top + r.height / 2; const o = regionList(cur()).map(x => x.region); const ti = o.indexOf(overEl.dataset.region); placeRegion(name, after ? o[ti + 1] || null : overEl.dataset.region); overEl.classList.remove('over'); overEl = null; }
      return;
    }
    if (!dragId) return;
    const id = dragId, region = dragRegion; dragId = null; dragRegion = null;
    document.querySelectorAll('.sel-item.dragging').forEach(x => x.classList.remove('dragging'));
    if (overEl) { const r = overEl.getBoundingClientRect(); const after = e.clientY > r.top + r.height / 2; const o = regionOrder(cur(), QUEST_DB.find(x => x.region === region)); const ti = o.indexOf(overEl.dataset.id); placeInRegion(region, id, after ? o[ti + 1] || null : overEl.dataset.id); overEl.classList.remove('over'); overEl = null; }
  });
})();

// 編輯排序模式
let sortMode = false;
function toggleSortMode() {
  sortMode = !sortMode;
  document.querySelector('#selModal .modal-card').classList.toggle('sorting', sortMode);
  $('sortBtn').innerText = sortMode ? '✓ 完成排序' : '↕️ 編輯排序';
  $('sortBtn').style.background = sortMode ? 'var(--green)' : '';
  $('sortBtn').style.color = sortMode ? '#fff' : '';
}
function closeSelect() { if (sortMode) toggleSortMode(); $('selModal').classList.remove('open'); render(); }

// 編輯清單的快速篩選（等級 / 類型）
const selFilter = { lv: 'all', type: 'all' };
function setSelFilter(k, v) { selFilter[k] = v; renderSelect(); }
function selMatch(r, q) { return (selFilter.lv === 'all' || String(r.lv) === selFilter.lv) && (selFilter.type === 'all' || q.type === selFilter.type); }
function renderSelect() {
  const c = cur(); $('selCharName').innerText = c.name;
  document.querySelectorAll('#selLv button').forEach(b => b.classList.toggle('active', b.dataset.v === selFilter.lv));
  document.querySelectorAll('#selType button').forEach(b => b.classList.toggle('active', b.dataset.v === selFilter.type));
  let shown = 0;
  $('selBody').innerHTML = regionList(c).map(r => {
    const qs = orderedQuests(c, r, q => selMatch(r, q)); if (!qs.length) return '';
    shown += qs.length;
    const all = qs.every(q => c.sel.includes(q.id));
    const custom = c.order && c.order[r.region];
    return `<div class="sel-region" data-region="${r.region}"><h3><span class="rhandle" title="拖曳調整地圖順序">⋮⋮</span>${r.region} <small style="color:var(--dim);font-weight:500">Lv ${r.lv}・${qs.length} 個</small><span class="acts">${custom ? `<button class="btn-ghost q-reset" onclick="resetRegionOrder('${r.region}')">恢復順序</button>` : ''}<button class="btn-ghost" onclick="selRegion('${r.region}', ${!all})">${all ? '取消全選' : '全選'}</button></span></h3>` +
      qs.map(q => `<div class="sel-item" data-id="${q.id}" data-region="${r.region}"><span class="handle" title="拖曳">⋮⋮</span><input type="checkbox" ${c.sel.includes(q.id) ? 'checked' : ''} onchange="toggleSel('${q.id}', this.checked)"><span class="qt qt-${q.type}">${QUEST_TYPE[q.type]}</span><span class="nm" onclick="this.previousElementSibling.previousElementSibling.click()">${q.name}</span></div>`).join('') + '</div>';
  }).join('') || `<div class="q-empty">沒有符合篩選的任務。</div>`;
  $('selCount').innerText = `顯示 ${shown} 個・已勾選 ${c.sel.length} 個`;
  $('regionResetBtn').style.display = c.regionOrder ? '' : 'none';
}

// ===== 畫面 =====
const navi = q => q.map && q.x != null && /^[a-z0-9_]+$/.test(q.map) ? `/navi ${q.map} ${q.x}/${q.y}` : '';
const esc = s => String(s).replace(/'/g, '&#39;');
function render() {
  const c = cur();
  updateExpandBtns();
  // 角色列
  $('chars').innerHTML = Object.entries(S.chars).map(([id, ch]) =>
    `<span class="chip ${id === S.cur ? 'cur' : ''}" onclick="switchChar('${id}')">${ch.name}</span>`).join('') +
    `<button class="btn-ghost" onclick="addChar()">＋ 新增角色</button><button class="btn-ghost" onclick="renameChar()">✏️ 改名</button><button class="btn-ghost" onclick="deleteChar()">🗑 刪除</button>`;

  // 今日任務
  $('boardChar').innerText = `｜${c.name}`;
  const sel = ALL.filter(q => c.sel.includes(q.id));
  const done = sel.filter(q => c.st[q.id] === 'done').length, turned = sel.filter(q => c.st[q.id] === 'turned').length;
  $('sumTotal').innerText = sel.length; $('sumDone').innerText = done; $('sumTurned').innerText = turned;
  const nr = nextReset();
  $('resetInfo').innerText = `每日 04:00 自動重置。下次重置：${pad(nr.getMonth() + 1)}/${pad(nr.getDate())} 04:00`;

  document.querySelectorAll('#boardType button').forEach(b => b.classList.toggle('active', b.dataset.v === boardType));
  const board = $('board');
  if (!sel.length) { board.innerHTML = `<div class="empty">還沒有設定清單，按「✏️ 編輯清單」勾選這個角色每天要做的任務。</div>`; }
  else {
    const html = orderedRegions(c, q => c.sel.includes(q.id) && (boardType === 'all' || q.type === boardType)).map(({ r, qs }) => {
      const t = qs.filter(q => c.st[q.id] === 'turned').length, d = qs.filter(q => c.st[q.id] === 'done').length;
      const ck = 'b:' + r.region;
      const cls = t === qs.length ? 'all-turned' : (t + d === qs.length ? 'all-done' : '');
      return `<div class="region ${cls} ${collapsed.has(ck) ? 'collapsed' : ''}"><h3><span class="tg" onclick="toggleRegion('${ck}')"><span class="arrow">▾</span>${r.region}</span> <span class="prog">已還 ${t}／完成 ${d}／共 ${qs.length}</span>
          <span class="acts"><button class="btn-ghost" onclick="setRegionState('${r.region}','done')">全部完成</button><button class="btn-ghost" onclick="setRegionState('${r.region}','turned')">全部已還</button><button class="btn-ghost" onclick="setRegionState('${r.region}','none')">清除</button></span></h3>` +
        qs.map(q => {
          const st = c.st[q.id] || 'none'; const nv = navi(q);
          return `<div class="qrow st-${st} ${openRows.has(q.id) ? 'open' : ''}">
            <div class="main">
              <div class="name" onclick="toggleRow('${q.id}')"><span class="arrow">▸</span><span class="qt qt-${q.type}">${QUEST_TYPE[q.type]}</span><span class="t">${q.name}</span><span class="lv">Lv ${r.lv}</span></div>
              <div class="states">
                <button class="${st === 'none' ? 'on-none' : ''}" onclick="setState('${q.id}','none')">未做</button>
                <button class="${st === 'done' ? 'on-done' : ''}" onclick="setState('${q.id}','done')">已完成</button>
                <button class="${st === 'turned' ? 'on-turned' : ''}" onclick="setState('${q.id}','turned')">已還</button>
              </div>
            </div>
            <div class="detail">
              <div class="row"><span class="k">目標</span><span>${q.goal || '—'}</span></div>
              ${q.npc ? `<div class="row"><span class="k">NPC</span><span>${q.npc}${q.map ? `（${q.map} ${q.x},${q.y}）` : ''}</span>${nv ? `<code class="navi">${nv}</code><button class="btn-copy" onclick="copyText('${nv}', this)">複製</button>` : ''}</div>` : ''}
              ${q.mats ? `<div class="row"><span class="k">材料</span><span>${q.mats.map(m => `${m.n} ×${m.q}`).join('、')}</span></div>` : ''}
              ${q.optMats ? `<div class="row"><span class="k">視情況</span><span>${q.optMats.map(m => `${m.n} ×${m.q}`).join('、')}</span></div>` : ''}
              ${q.pre ? `<div class="row"><span class="k">前置</span><span>${q.pre}${q.preUrl ? ` <a href="${q.preUrl}" target="_blank" rel="noopener" style="color:var(--primary)">攻略 ↗</a>` : ''}</span></div>` : ''}
              ${q.note ? `<div class="row"><span class="k">注意</span><span>${q.note}</span></div>` : ''}
              ${q.reward ? `<div class="row"><span class="k">獎勵</span><span>${q.reward}</span></div>` : ''}
            </div></div>`;
        }).join('') + '</div>';
    }).join('');
    board.innerHTML = html || `<div class="empty">今天的清單裡沒有「${QUEST_TYPE[boardType]}」類型的任務。</div>`;
  }

  // 材料：依區域彙整已選任務（已還的任務不再列入）
  const matRow = (key, n, q, from) => `<label class="mat ${c.mats[key] ? 'ok' : ''}"><input type="checkbox" ${c.mats[key] ? 'checked' : ''} onchange="toggleMat('${esc(key)}')"><span class="n">${n}</span><span class="q">×${q}</span><span class="from">${[...new Set(from)].join('、')}</span></label>`;
  let matsHtml = '';
  for (const { r, qs } of orderedRegions(c, q => c.sel.includes(q.id) && c.st[q.id] !== 'turned')) {
    const need = {}, opt = {}, from = {};
    qs.forEach(q => {
      (q.mats || []).forEach(m => { need[m.n] = (need[m.n] || 0) + m.q; (from[m.n] = from[m.n] || []).push(q.name); });
      (q.optMats || []).forEach(m => { opt[m.n] = Math.max(opt[m.n] || 0, m.q); (from[m.n] = from[m.n] || []).push(q.name); });
    });
    const nNeed = Object.keys(need).length, nOpt = Object.keys(opt).length;
    if (!nNeed && !nOpt) continue;
    const ck = 'm:' + r.region;
    matsHtml += `<div class="region ${collapsed.has(ck) ? 'collapsed' : ''}"><h3><span class="tg" onclick="toggleRegion('${ck}')"><span class="arrow">▾</span>${r.region}</span><span class="cnt">${nNeed} 項${nOpt ? `・視情況 ${nOpt} 項` : ''}</span></h3><div class="mats">` +
      Object.entries(need).map(([n, q]) => matRow(r.region + '|' + n, n, q, from[n])).join('') +
      (nOpt ? `<div class="sec-title">視情況需要（隨機支線）</div>` + Object.entries(opt).map(([n, q]) => matRow(r.region + '|opt|' + n, n, q, from[n])).join('') : '') +
      `</div></div>`;
  }
  $('mats').innerHTML = matsHtml || `<div class="empty">今天的任務不需要準備材料。</div>`;

  // 路線指引
  const showAll = $('routeAll').checked;
  $('route').innerHTML = orderedRegions(c, q => showAll || c.sel.includes(q.id)).map(({ r, qs }) => {
    const ck = 'r:' + r.region;
    return `<div class="region ${collapsed.has(ck) ? 'collapsed' : ''}"><h3><span class="tg" onclick="toggleRegion('${ck}')"><span class="arrow">▾</span>${r.region}</span> <small style="color:var(--dim);font-weight:500">Lv ${r.lv}・${qs.length} 個</small></h3>` +
      (r.tip ? `<div class="tip">💡 ${r.tip}</div>` : '') +
      qs.map((q, i) => { const nv = navi(q); return `<div class="step ${c.st[q.id] === 'turned' ? 'turned' : ''}"><b>${i + 1}. <span class="qt qt-${q.type}">${QUEST_TYPE[q.type]}</span> ${q.name}</b>
          ${q.npc ? `<div>NPC：${q.npc}${q.map ? `（${q.map} ${q.x},${q.y}）` : ''} ${nv ? `<code class="navi">${nv}</code> <button class="btn-copy" onclick="copyText('${nv}', this)">複製</button>` : ''}</div>` : ''}
          <div>${q.goal || ''}</div>
          ${q.pre ? `<div style="color:var(--dim)">前置：${q.pre}${q.preUrl ? ` <a href="${q.preUrl}" target="_blank" rel="noopener" style="color:var(--primary)">攻略 ↗</a>` : ''}</div>` : ''}${q.note ? `<div style="color:var(--dim)">注意：${q.note}</div>` : ''}</div>`; }).join('') + '</div>';
  }).join('') || `<div class="empty">清單是空的；勾選「顯示全部任務」可瀏覽所有任務的路線。</div>`;
}

// ===== 共用：複製、主題 =====
function copyText(text, btn) {
  const done = () => { const t = btn.innerText; btn.innerText = '已複製'; setTimeout(() => btn.innerText = t, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => prompt('請手動複製：', text));
  else prompt('請手動複製：', text);
}
function applyTheme(t) {
  if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); $('themeBtn').innerText = '☀️ 日間模式'; }
  else { document.documentElement.removeAttribute('data-theme'); $('themeBtn').innerText = '🌙 夜間模式'; }
}
function toggleTheme() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; localStorage.setItem('theme', t); applyTheme(t); }
applyTheme(localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSelect(); if ($('dlg').classList.contains('open')) $('dlgCancel').onclick(); } });

load();
render();
</script>
